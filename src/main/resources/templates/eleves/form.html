<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head>
    <title th:text="${eleve.id == null ? 'Ajouter un Élève' : 'Modifier Élève'}"></title>
</head>
<body>
    <div th:fragment="content">
        <div class="card shadow-sm p-4">
            <h3 th:text="${eleve.id == null ? 'Ajouter un Élève' : 'Modifier Élève'}"></h3>

            <form th:action="${eleve.id == null} ? @{/eleves} : @{/eleves/{id}(id=${eleve.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input class="form-control" type="text" name="nom" th:value="${eleve.nom}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Prénom</label>
                    <input class="form-control" type="text" name="prenom" th:value="${eleve.prenom}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Filière</label>
                    <select class="form-select" name="filiereId">
                        <option value="">-- Aucune --</option>
                        <option th:each="f : ${filieres}"
                                th:value="${f.id}"
                                th:text="${f.code + ' - ' + f.nom}"
                                th:selected="${eleve.filiere != null and eleve.filiere.id == f.id}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cours</label>
                    <div class="form-check" th:each="c : ${coursList}">
                        <input class="form-check-input" type="checkbox" name="coursIds" th:value="${c.id}" th:checked="${eleve.cours.contains(c)}">
                        <label class="form-check-label" th:text="${c.intitule}"></label>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Enregistrer</button>
                <a th:href="@{/eleves}" class="btn btn-secondary">Retour</a>
            </form>
        </div>
    </div>
</body>
</html>
